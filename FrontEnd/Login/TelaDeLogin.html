<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="TelaDeLogin.css">
</head>
<body>
    <div class="container">
        <img class="logo" src="einstein-1.png" alt="Logo da empresa">
        <div class="login-box">
            <form id="login-form">
                <h2>Acessar</h2>

                <div class="input-group">
                    <input type="text" id="ra" name="ra" placeholder="Digite seu RA..." required>
                    <span class="error-message"></span>
                </div>

                <div class="input-group">
                    <input type="password" id="senha" name="senha" placeholder="Digite sua Senha..." required autocomplete="current-password">

                    <span class="error-message"></span>
                </div>

                <button type="submit" class="btn">Entrar</button>
                <p id="login-status"></p>
            </form>
        </div>
    </div>

    <script src="TelaDeLogin.js"></script>
</body>
</html>
