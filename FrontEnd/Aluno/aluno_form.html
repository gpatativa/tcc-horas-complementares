<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="aluno_form.css"> 
    <!-- <link rel="stylesheet" href="../Coordenador/PlataformaCoordenador.css">  Ajustar para pegar o menu do prof-->
    <script defer src="../Coordenador/Menu.js"></script> <!-- Validação com JS -->
</head>

<script>
    document.addEventListener("DOMContentLoaded", function() {
    const form = document.querySelector("form");
    const senhaInput = document.getElementById("senha");
    const erroSenha = document.getElementById("erro-senha");

    form.addEventListener("submit", function(event) {
        if (senhaInput.value.length < 8) {
            event.preventDefault(); // Impede envio do formulário
            erroSenha.textContent = "A senha deve ter pelo menos 8 caracteres!";
            erroSenha.style.color = "red";
        } else {
            erroSenha.textContent = "";
        }
    });
});

</script>
<body>

    <div id="menu-container"></div> 

    <div class="container">
        <h2>Cadastro de Aluno</h2>
        <form method="POST" action="../../BackEnd/Aluno/aluno_processamento.php">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            
            <label for="ra">RA:</label>
            <input type="text" id="ra" name="ra" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso" required>

            <label for="periodo">Período:</label>
            <select id="periodo" name="periodo" required>
                <option value="1° Semestre">1° Semestre</option>
                <option value="2° Semestre">2° Semestre</option>
                <option value="3° Semestre">3° Semestre</option>
                <option value="4° Semestre">4° Semestre</option>
                <option value="5° Semestre">5° Semestre</option>
            </select>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <span id="erro-senha" class="erro-msg"></span> <!-- Mensagem de erro -->

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
