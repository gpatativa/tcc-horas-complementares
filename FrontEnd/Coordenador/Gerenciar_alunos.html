<!DOCTYPE html>
<html lang="pt-BR">
    <script defer src="Menu.js"></script> 
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Alunos</title>
    <link rel="stylesheet" href="PlataformaCoordenador.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('../../BackEnd/Coordenador/GerenciarAlunos.php')
                .then(response => response.json())
                .then(data => {
                    console.log("DATA RECEBIDA:", data); // Para depuração
                    preencherSelect('curso', data.cursos);
                    preencherSelect('anoInicio', data.Ano_inicio.map(p => `${p}º`));
                    preencherSelect('Coordenador', data.coordenadores);
                })
                .catch(error => {
                    console.error('Erro ao carregar os dados:', error);
                });

            function preencherSelect(id, valores) {
                const select = document.getElementById(id);
                if (!select) return;

                select.innerHTML = '<option value="">Todos</option>';
                valores.forEach(valor => {
                    const option = document.createElement('option');
                    option.value = valor;
                    option.textContent = valor;
                    select.appendChild(option);
                });
            }
        });
    </script>
</head>
<body>

    <div id="menu-container"></div>

<div class="container-gerenciar-alunos">
    <h2>Gerenciamento de Atividades</h2>

    <div class="filtros">
        <label for="curso">Curso:</label>
        <select id="curso"></select>

        <label for="anoInicio">Ano de Início:</label>
        <select id="anoInicio"></select>

        <label for="Coordenador">Coordenador:</label>
        <select id="Coordenador"></select>

        <label for="deferido">Deferido:</label>
        <select id="deferido">
            <option value="todos">Todos</option>
            <option value="sim">Sim</option>
            <option value="não">Não</option>
        </select>

        <button class="button-filtrar" onclick="filtrarAlunos()">Filtrar</button>

        <div class="pesquisa">
            <input type="text" id="pesquisaNome" placeholder="Pesquisar nome...">
            <button onclick="pesquisarNome()">🔍</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Curso</th>
                <th>Ano de início</th>
                <th>Deferido</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista-alunos">
            <!-- Conteúdo dinâmico futuro -->
        </tbody>
    </table>
</div>
<script src="Menu.js"></script>
</body>
</html>
