<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Curso</title>
    
    <link rel="stylesheet" href="Listar_coordenadores-cursos.css">
    <link rel="stylesheet" href="PlataformaCoordenador.css">
    <script defer src="Menu.js"></script> 
</head>
<body>

    <div id="menu-container"></div> 

    <div class="container">
        <h2>Cadastro de Curso</h2>
        <form method="POST" action="../../BackEnd/Coordenador/Cad_curso.php">
            <label for="Nome_curso">Nome:</label>
            <input type="text" id="Nome_curso" name="Nome_curso" required>
            
            <label for="Ano_inicio">Ano de Início:</label>
            <input type="number" id="Ano_inicio" name="Ano_inicio" placeholder="Ano em que o aluno ingressou" required>

            <label for="Coordenador">Nome do Coordenador:</label>
            <input type="text" id="Coordenador" name="Coordenador" required>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
    <script src="Menu.js"></script>
</body>
</html>
