<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno</title>
  <link rel="stylesheet" href="../Coordenador/PlataformaCoordenador.css">
  <script defer src="Menu.js"></script>
</head>
<body>

    <div id="menu-container"></div> 

  <div class="container">
    <h2>Cadastro de Aluno</h2>
    <form id="form-aluno">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="ra">RA:</label>
      <input type="number" id="ra" name="ra" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="curso">Curso:</label>
      <input type="text" id="curso" name="curso" required>

      <label for="Ano_inicio">Ano de início:</label>
      <input type="number" id="Ano_inicio" name="Ano_inicio" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Pelo menos 8 caracteres">
      <span id="erro-senha" class="erro-msg"></span>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <script>
    document.getElementById("form-aluno").addEventListener("submit", function(event) {
      event.preventDefault();

      const form = event.target;
      const senha = document.getElementById("senha").value;

      if (senha.length < 8) {
        document.getElementById("erro-senha").textContent = "A senha deve ter pelo menos 8 caracteres!";
        return;
      } else {
        document.getElementById("erro-senha").textContent = "";
      }

      const formData = new FormData(form);

      fetch("/tcc-horas-complementares/BackEnd/Coordenador/Cad_aluno.php", {
        method: "POST",
        body: formData
      })

      .then(async res => {
        const msg = await res.text();
        if (!res.ok) throw new Error(msg);
        alert(msg);
        form.reset();
      })
      .catch(err => {
        alert("Erro: " + err.message);
      });
    });
  </script>
</body>
</html>
