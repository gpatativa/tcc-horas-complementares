<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno</title>
  <link rel="stylesheet" href="PlataformaCoordenador.css">
  <script defer src="Menu.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const cursoSelect = document.getElementById("curso");
      const anoSelect = document.getElementById("Ano_inicio");

      fetch("../../BackEnd/Coordenador/Listar_cursos.php")
        .then(response => response.json())
        .then(data => {
          data.forEach(curso => {
            const option = document.createElement("option");
            option.value = curso.Id_curso; // valor correto agora é o ID
            option.textContent = curso.Nome_curso;
            cursoSelect.appendChild(option);
          });
        })
        .catch(error => console.error("Erro ao carregar cursos:", error));

      fetch("../../BackEnd/Coordenador/Listar_anos.php")
        .then(response => response.json())
        .then(data => {
          data.forEach(ano => {
            const option = document.createElement("option");
            option.value = ano;
            option.textContent = ano;
            anoSelect.appendChild(option);
          });
        })
        .catch(error => console.error("Erro ao carregar anos:", error));
    });
  </script>
</head>
<body>

  <div id="menu-container"></div> 

  <div class="container">
    <h2>Cadastro de Aluno</h2>
    <form id="form-aluno">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="ra">RA:</label>
      <input type="number" id="ra" name="ra" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <div class="filtro-bloco">
        <label for="curso">Curso:</label>
        <select id="curso" name="cursoId" required>
          <option value="">Selecione o curso</option>
        </select>
      </div>

      <div class="filtro-bloco">
        <label for="Ano_inicio">Ano de início:</label>
        <select id="Ano_inicio" name="Ano_inicio" required>
          <option value="">Selecione o ano</option>
        </select>
      </div>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Pelo menos 8 caracteres">
      <span id="erro-senha" class="erro-msg"></span>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <script>
    document.getElementById("form-aluno").addEventListener("submit", function(event) {
      event.preventDefault();

      const form = event.target;
      const senha = document.getElementById("senha").value;

      if (senha.length < 8) {
        document.getElementById("erro-senha").textContent = "A senha deve ter pelo menos 8 caracteres!";
        return;
      } else {
        document.getElementById("erro-senha").textContent = "";
      }

      const formData = new FormData(form);

      fetch("/tcc-horas-complementares/BackEnd/Coordenador/Cad_aluno.php", {
        method: "POST",
        body: formData
      })
      .then(async res => {
        const msg = await res.text();
        if (!res.ok) throw new Error(msg);
        alert(msg);
        form.reset();
      })
      .catch(err => {
        alert("Erro: " + err.message);
      });
    });
  </script>
</body>
</html>
