    <link rel="stylesheet" href="PlataformaCoordenador.css">

</head>
<body>

    <div class="menu-lateral">
        <h2>Menu</h2>
        <ul>
            <li><a href="HomeCoordenador.html" onclick="mostrarSecao('home')">🏠 Home</a></li>
            <li><a href="#" onclick="mostrarSecao('perfil')">👤 Perfil</a></li>
            <li><a href="GerenciarAlunos.html" onclick="mostrarSecao('gerenciar-alunos')">📋 Gerenciar Alunos</a></li>
            <li><a href="CadCurso.html" onclick="mostrarSecao('adicionar-curso')">➕ Adicionar Curso</a></li>

            <li><a href="#" onclick="mostrarSecao('sair')">❌ Sair</a></li>
        </ul>
    </div>

    <div class="container">
        <h2>Cadastro de Coordenador</h2>
        <form method="POST" action="../../BackEnd/Coordenador/coordenador_processamento.php">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            
            <label for="ra">RA:</label>
            <input type="text" id="ra" name="ra" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required >

            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <span id="erro-senha" class="erro-msg"></span> <!-- Exibir erro aqui -->

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
