<!DOCTYPE html>
<html lang="pt-br">
<head>
<<<<<<< HEAD
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Coordenador</title>
    <link rel="stylesheet" href="PlataformaCoordenador.css">

    <script defer src="Menu.js"></script> 
</head>

<body>

    <div id="menu-container"></div>
    
  <div class="container">
    <h2>Cadastro de Coordenador</h2>
    <form id="form-coordenador">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="ra">RA:</label>
      <input type="text" id="ra" name="ra" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="curso">Curso:</label>
      <select id="curso" name="curso" required>
          <option value="">Selecione um curso</option>
      </select>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>
      <span id="erro-senha" class="erro-msg"></span>

      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <script>
    document.getElementById("form-coordenador").addEventListener("submit", function(event) {
      event.preventDefault();

      const form = event.target;
      const senha = document.getElementById("senha").value;

      if (senha.length < 8) {
        document.getElementById("erro-senha").textContent = "A senha deve ter pelo menos 8 caracteres!";
        return;
      } else {
        document.getElementById("erro-senha").textContent = "";
      }

      const formData = new FormData(form);

      fetch("../../BackEnd/Coordenador/coordenador_processamento.php", {
        method: "POST",
        body: formData
      })
      .then(async res => {
        const msg = await res.text();
        if (!res.ok) throw new Error(msg);
        alert(msg);
        form.reset();
      })
      .catch(err => {
        alert("Erro: " + err.message);
      });
    });

    fetch("../../BackEnd/Coordenador/Listar_cursos.php")
    .then(response => response.json())
    .then(data => {
        const select = document.getElementById("curso");
        data.forEach(curso => {
            const option = document.createElement("option");
            option.value = curso.Nome_curso;
            option.textContent = curso.Nome_curso;
            select.appendChild(option);
        });
    })
    .catch(error => {
        console.error("Erro ao carregar cursos:", error);
    });
  </script>
</body>
</html>
