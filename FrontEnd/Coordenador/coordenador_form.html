<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Coordenador</title>
    <link rel="stylesheet" href="PlataformaCoordenador.css">
    <script defer src="coordenador_form.js"></script> <!-- Adicionando JS -->
    <script defer src="Menu.js"></script> 
</head>
<body>

    <div id="menu-container"></div>

    <div class="container">
        <h2>Cadastro de Coordenador</h2>
        <form method="POST" action="../../BackEnd/Coordenador/coordenador_processamento.php">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            
            <label for="ra">RA:</label>
            <input type="text" id="ra" name="ra" required>

            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
            <span id="erro-senha" class="erro-msg"></span> <!-- Exibir erro aqui -->

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
