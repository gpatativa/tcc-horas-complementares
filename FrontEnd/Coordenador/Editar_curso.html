<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Curso</title>
  <link rel="stylesheet" href="PlataformaCoordenador.css" />
  <link rel="stylesheet" href="Listar_coordenadores-cursos.css" />
  <script defer src="Menu.js"></script>
</head>

<body>
  <div id="menu-container"></div>

  <div class="container">
    <h2>Editar Curso</h2>
    <form id="form-curso">
      <input type="hidden" id="Id_curso" name="Id_curso" />

      <label for="Nome_curso">Nome:</label>
      <input type="text" id="Nome_curso" name="Nome_curso" required />

      <label for="Ano_inicio">Ano de Início:</label>
      <input type="number" id="Ano_inicio" name="Ano_inicio" required />

      <label for="Coordenador">Nome do Coordenador:</label>
      <input type="text" id="Coordenador" name="Coordenador" required />

      <button type="submit">Salvar Alterações</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("form-curso");

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        alert("ID do curso não informado!");
        window.location.href = "Listar_cursos.html";
        return;
      }

      fetch(`../../BackEnd/Coordenador/Buscar_curso.php?id=${id}`)
        .then(res => res.json())
        .then(data => {
          if (data.erro) {
            alert(data.erro);
            return;
          }

          document.getElementById("Id_curso").value = data.Id_curso;
          document.getElementById("Nome_curso").value = data.Nome_curso;
          document.getElementById("Ano_inicio").value = data.Ano_inicio;
          document.getElementById("Coordenador").value = data.Coordenador;
        })
        .catch(err => {
          alert("Erro ao carregar curso: " + err.message);
        });
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const nome = document.getElementById("Nome_curso").value.trim();
      const ano = parseInt(document.getElementById("Ano_inicio").value);
      const coordenador = document.getElementById("Coordenador").value.trim();
      const id = document.getElementById("Id_curso").value;
      const anoAtual = new Date().getFullYear();

      if (!nome) return alert("O nome do curso é obrigatório.");
      if (isNaN(ano) || ano < 2000 || ano > anoAtual)
        return alert("O ano de início deve estar entre 2000 e " + anoAtual + ".");
      if (!coordenador) return alert("O nome do coordenador é obrigatório.");

      const formData = new FormData();
      formData.append("Id_curso", id);
      formData.append("Nome_curso", nome);
      formData.append("Ano_inicio", ano);
      formData.append("Coordenador", coordenador);

      fetch("../../BackEnd/Coordenador/Atualizar_curso.php", {
        method: "POST",
        body: formData
      })
        .then(res => res.json())
        .then(data => {
          if (data.sucesso) {
            window.location.href = "Listar_cursos.html";
          } else {
            alert(data.mensagem || "Erro ao atualizar o curso.");
          }
        })
        .catch(err => {
          alert("Erro ao enviar os dados: " + err.message);
        });
    });
  </script>
</body>
</html>
