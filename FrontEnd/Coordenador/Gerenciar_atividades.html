<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciamento de Atividades</title>
  <link rel="stylesheet" href="PlataformaCoordenador.css">
  <script defer src="Menu.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('../../BackEnd/Coordenador/Gerenciar_atividades.php')
        .then(response => response.json())
        .then(data => {
          preencherSelect('curso', data.cursos);
          preencherSelect('anoInicio', data.Ano_inicio.map(p => `${p}`));
          preencherSelect('Coordenador', data.coordenadores);
          preencherTabela(data.atividades);
        })
        .catch(error => {
          console.error('Erro ao carregar os dados:', error);
        });

      function preencherSelect(id, valores) {
        const select = document.getElementById(id);
        if (!select) return;

        select.innerHTML = '<option value="">Todos</option>';
        valores.forEach(valor => {
          const option = document.createElement('option');
          option.value = valor;
          option.textContent = valor;
          select.appendChild(option);
        });
      }

      function preencherTabela(lista) {
        const tbody = document.getElementById('lista-alunos');
        tbody.innerHTML = '';

        if (!lista.length) {
          tbody.innerHTML = '<tr><td colspan="8">Nenhum dado encontrado.</td></tr>';
          return;
        }

        lista.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.Nome}</td>
            <td>${item.Curso}</td>
            <td>${item.Ano_inicio}</td>
            <td>${item.CargaHoraria || '0'}h</td>
            <td>${item.HorasAprovadas ?? '0'}h</td>
            <td>${item.Status || 'Pendente'}</td>
            <td><button onclick="abrirDetalhes(${item.atividade_id})">Avaliar</button></td>
          `;
          tbody.appendChild(tr);
        });
      }

      window.abrirDetalhes = function(id) {
        window.location.href = 'Avaliar_atividade.html?id=' + id;
      };

      window.filtrarAlunos = function() {
        const curso = document.getElementById('curso').value;
        const anoInicio = document.getElementById('anoInicio').value;
        const coordenador = document.getElementById('Coordenador').value;
        const deferido = document.getElementById('deferido').value;
        const nomeBusca = document.getElementById('pesquisaNome').value.toLowerCase();

        fetch('../../BackEnd/Coordenador/Gerenciar_atividades.php')
          .then(response => response.json())
          .then(data => {
            let listaFiltrada = data.atividades;

            if (curso) {
              listaFiltrada = listaFiltrada.filter(item => item.Curso === curso);
            }
            if (anoInicio) {
              listaFiltrada = listaFiltrada.filter(item => item.Ano_inicio == anoInicio);
            }
            if (coordenador) {
              listaFiltrada = listaFiltrada.filter(item => item.Coordenador === coordenador);
            }
            if (deferido === 'sim') {
              listaFiltrada = listaFiltrada.filter(item => item.Status.toLowerCase() === 'aprovado');
            } else if (deferido === 'não') {
              listaFiltrada = listaFiltrada.filter(item => item.Status.toLowerCase() === 'rejeitado');
            }
            else if (deferido === 'pendente') {
              listaFiltrada = listaFiltrada.filter(item => item.Status.toLowerCase() === 'pendente');
            }
            if (nomeBusca) {
              listaFiltrada = listaFiltrada.filter(item =>
                item.Nome.toLowerCase().includes(nomeBusca)
              );
            }

            preencherTabela(listaFiltrada);
          })
          .catch(error => console.error('Erro ao aplicar filtros:', error));
      };

      window.pesquisarNome = function() {
        filtrarAlunos();
      }
    });
  </script>

</head>
<body>
  <div id="menu-container"></div>

  <div class="container-gerenciar-alunos">
    <h2>Gerenciamento de Atividades</h2>

    <div class="filtros">
      <div class="filtro-bloco">
        <label for="curso">Curso:</label>
        <select id="curso"></select>
      </div>

      <div class="filtro-bloco">
        <label for="anoInicio">Ano de Início:</label>
        <select id="anoInicio"></select>
      </div>

      <div class="filtro-bloco">
        <label for="Coordenador">Coordenador:</label>
        <select id="Coordenador"></select>
      </div>

      <div class="filtro-bloco">
        <label for="deferido">Deferido:</label>
        <select id="deferido">
          <option value="todos">Todos</option>
          <option value="sim">Sim</option>
          <option value="não">Não</option>
          <option value="pendente">Pendente</option>
        </select>
      </div>

      <div class="filtro-bloco" style="display: flex; flex-direction: row; align-items: flex-end; gap: 5px;">
        <button class="button-filtrar" onclick="filtrarAlunos()">Filtrar</button>
        <div class="barra-pesquisa">
          <input type="text" id="pesquisaNome" placeholder="Pesquisar nome...">
          <button onclick="pesquisarNome()">🔍</button>
        </div>
      </div>
    </div>

    <div class="tabela-container">
      <table class="table-atividades">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Curso</th>
            <th>Ano de início</th>
            <th>Horas Solicitadas</th>
            <th>Horas Aprovadas</th>
            <th>Deferido</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-alunos">
          <!-- Conteúdo dinâmico -->
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
