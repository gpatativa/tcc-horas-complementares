<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Atividade</title>
    <link rel="stylesheet" href="PlataformaCoordenador.css">
    <script defer src="Menu.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                alert("ID da atividade não informada!");
                window.location.href = "Listar_atividades.html";
                return;
            }

            // Buscar dados da atividade
            fetch(`../../BackEnd/Coordenador/Buscar_atividade.php?id=${id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.erro) {
                        alert(data.erro);
                        return;
                    }

                    document.getElementById("Id").value = data.Id;
                    document.getElementById("Tipo").value = data.Tipo;
                    document.getElementById("Descricao").value = data.Descricao;
                    document.getElementById("CargaHorariaMaxima").value = data.CargaHorariaMaxima;
                })
                .catch(err => {
                    alert("Erro ao carregar atividade: " + err.message);
                });
        });

        function salvarAlteracoes(event) {
            event.preventDefault();

            const form = document.getElementById("form-curso");
            const formData = new FormData(form);

            fetch("../../BackEnd/Coordenador/Atualizar_atividade.php", {
                method: "POST",
                body: formData
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                window.location.href = "Listar_atividades.html";
            })
            .catch(err => {
                alert("Erro ao atualizar atividade: " + err.message);
            });
        }
    </script>
</head>
<body>
    <div id="menu-container"></div>

    <div class="container">
        <h2>Editar Atividade</h2>
        <form id="form-curso" onsubmit="salvarAlteracoes(event)">
            <input type="hidden" id="Id" name="Id">

            <label for="Tipo">Categoria:</label>
            <input type="text" id="Tipo" name="Tipo" required>

            <label for="Descricao">Descrição:</label>
            <input type="text" id="Descricao" name="Descricao" required>

            <label for="CargaHorariaMaxima">Carga Horária Máxima:</label>
            <input type="number" id="CargaHorariaMaxima" name="CargaHorariaMaxima" required>

            <button type="submit">Salvar Alterações</button>
        </form>
    </div>
    <script src="Menu.js"></script>
</body>
</html>
