<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Aluno</title>
  <link rel="stylesheet" href="PlataformaCoordenador.css" />
  <link rel="stylesheet" href="Listar_coordenadores-cursos.css" />
  <script defer src="Menu.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const alunoId = urlParams.get('id');

      if (!alunoId) {
        alert('ID do aluno não fornecido.');
        return;
      }

      fetch(`/tcc-horas-complementares/BackEnd/Coordenador/Buscar_aluno.php?id=${alunoId}`)
        .then(response => response.json())
        .then(data => preencherFormulario(data))
        .catch(error => alert('Erro ao carregar dados do aluno: ' + error.message));

      const form = document.getElementById('form-editar-aluno');
      form.addEventListener('submit', event => {
        event.preventDefault();
        atualizarAluno(alunoId);
      });
    });

    function preencherFormulario(aluno) {
      document.getElementById('nome').value = aluno.Nome;
      document.getElementById('ra').value = aluno.RA;
      document.getElementById('curso').value = aluno.Curso;
      document.getElementById('ano_inicio').value = aluno.Ano_inicio;
      document.getElementById('email').value = aluno.email;
    }

    function atualizarAluno(id) {
      const dados = {
        Id: id,
        Nome: document.getElementById('nome').value,
        RA: document.getElementById('ra').value,
        Curso: document.getElementById('curso').value,
        Ano_inicio: document.getElementById('ano_inicio').value,
        email: document.getElementById('email').value
      };

      console.log("🧾 Dados enviados:", dados);

      fetch("/tcc-horas-complementares/BackEnd/Coordenador/Atualizar_aluno.php", {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
      .then(async response => {
        const texto = await response.text();
        console.log("🔍 Resposta bruta do servidor:", texto);
        try {
          return JSON.parse(texto);
        } catch (e) {
          throw new Error("Resposta inválida do servidor:\n" + texto);
        }
      })
      .then(data => {
        alert(data.sucesso || data.erro);
        if (data.sucesso) {
          window.location.href = 'Listar_alunos.html';
        }
      })
      .catch(error => alert('Erro ao atualizar aluno: ' + error.message));
    }
  </script>
</head>
<body>

  <div id="menu-container"></div>

  <div class="container">
    <h2>Editar Aluno</h2>
    <form id="form-editar-aluno">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required><br>

      <label for="ra">RA:</label>
      <input type="text" id="ra" name="ra" required><br>

      <label for="curso">Curso:</label>
      <input type="text" id="curso" name="curso" required><br>

      <label for="ano_inicio">Ano de Início:</label>
      <input type="text" id="ano_inicio" name="ano_inicio" required><br>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required><br>

      <button type="submit">Salvar Alterações</button>
    </form>
  </div>
</body>
</html>
