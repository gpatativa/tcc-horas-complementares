<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Atividades</title>
    
    <link rel="stylesheet" href="Listar_coordenadores-cursos.css">
    <link rel="stylesheet" href="PlataformaCoordenador.css">
    <script defer src="Menu.js"></script> 
</head>
<body>

    <div id="menu-container"></div> 

    <div class="container">
        <h2>Cadastro de Atividade</h2>
        <form method="POST" action="../../BackEnd/Coordenador/Cad_atividade.php">
            <label for="Tipo">Categoria:</label>
            <input type="text" id="Tipo" name="Tipo" required>
            
            <label for="Descricao">Descrição:</label>
            <input type="text" id="Descricao" name="Descricao" required>

            <label for="CargaHorariaMaxima">Carga Horária Máxima:</label>
            <input type="number" id="CargaHorariaMaxima" name="CargaHorariaMaxima" required>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
    <script src="Menu.js"></script>
</body>
</html>
